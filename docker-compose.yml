services:
  ai:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - HF_HOME=/cache/huggingface
    volumes:
      - hf_cache:/cache/huggingface
    restart: unless-stopped

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "3001:3001"
    environment:
      - AI_URL=http://ai:8000
      - GATEWAY_PORT=3001
      - WINDOW_SIZE=45
      - INFER_EVERY_MS=400
    depends_on:
      - ai
    restart: unless-stopped

volumes:
  hf_cache:
